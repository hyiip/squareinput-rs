[package]
name = "squareinput-tsf"
version = "0.3.1"
edition = "2024"
description = "Shape-based Chinese input method as a TSF text service"

[lib]
crate-type = ["cdylib", "rlib"]

# Windows only: elsewhere the crate is empty, so the workspace builds everywhere.
[target.'cfg(windows)'.dependencies]
squareinput = { path = "../squareinput" }
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
